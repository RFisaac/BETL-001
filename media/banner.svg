<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="BETL-001 Beetle — build log">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#070604"/>
    </radialGradient>
    <filter id="bloom" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#glow)"/>
  <rect x="10" y="10" width="1180" height="260" rx="10" fill="none" stroke="#ffb000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- pixel beetle: green shell, smoked-grey eyes, Y-horn -->
  <g transform="translate(70,58)" filter="url(#bloom)">
    <g fill="#3fbf5a">
      <rect x="48" y="0"  width="96" height="12"/>
      <rect x="36" y="12" width="120" height="12"/>
      <rect x="24" y="24" width="144" height="60"/>
      <rect x="36" y="84" width="120" height="12"/>
    </g>
    <rect x="94" y="12" width="4" height="84" fill="#0b1a0e" opacity="0.8"/>
    <g fill="#5fd97a" opacity="0.55">
      <rect x="48" y="24" width="24" height="12"/>
      <rect x="120" y="24" width="24" height="12"/>
    </g>
    <!-- head + eyes -->
    <rect x="168" y="30" width="36" height="48" fill="#2c8a40"/>
    <rect x="178" y="36" width="16" height="14" fill="#5a5a5a"/>
    <rect x="178" y="58" width="16" height="14" fill="#5a5a5a"/>
    <rect x="186" y="40" width="6" height="6" fill="#ffb000"/>
    <rect x="186" y="62" width="6" height="6" fill="#ffb000"/>
    <!-- horn -->
    <g fill="#9aa0a6">
      <rect x="204" y="50" width="24" height="8"/>
      <rect x="228" y="34" width="8" height="40"/>
      <rect x="236" y="30" width="14" height="8"/>
      <rect x="236" y="70" width="14" height="8"/>
    </g>
    <!-- mecanum wheels -->
    <g fill="#1b1b1b" stroke="#ffb000" stroke-opacity="0.6" stroke-width="2">
      <rect x="28"  y="98" width="40" height="22" rx="4"/>
      <rect x="124" y="98" width="40" height="22" rx="4"/>
    </g>
    <g stroke="#ffb000" stroke-opacity="0.6" stroke-width="2">
      <line x1="34" y1="118" x2="44" y2="100"/><line x1="46" y1="118" x2="56" y2="100"/><line x1="58" y1="118" x2="66" y2="104"/>
      <line x1="130" y1="100" x2="140" y2="118"/><line x1="142" y1="100" x2="152" y2="118"/><line x1="154" y1="100" x2="162" y2="114"/>
    </g>
  </g>

  <g font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" fill="#ffb000" filter="url(#bloom)">
    <text x="380" y="118" font-size="72" font-weight="700" letter-spacing="6">BETL-001</text>
    <text x="384" y="160" font-size="23" letter-spacing="2" fill-opacity="0.85">"BEETLE" // SCRATCH-BUILT EXPRESSIVE ROBOT</text>
    <text x="384" y="204" font-size="20" letter-spacing="2" fill-opacity="0.65">RDK X5 · MECANUM · HOVERBOARD HUBS · LIDAR · BUILD LOG</text>
    <text x="384" y="238" font-size="16" letter-spacing="2" fill-opacity="0.45">&gt; status: rebuilding for Maker Faire Shenzhen_</text>
  </g>

  <rect width="1200" height="280" rx="14" fill="url(#scan)"/>
</svg>
